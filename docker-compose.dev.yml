services:
  # ----------------------------------------------------------------------------
  # Database Service: MySQL 8.0 (Same network and data volume)
  # ----------------------------------------------------------------------------
  smart-energy-mysql:
    image: mysql:8.0
    container_name: smart-energy-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --event-scheduler=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-smart_energy_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smart-energy-mysql-data:/var/lib/mysql
      - ./dashboard/prisma/init_mysql.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smart-energy-network

  # ----------------------------------------------------------------------------
  # Web Dashboard Service: Next.js (Development with Hot Reloading)
  # ----------------------------------------------------------------------------
  smart-energy-dashboard-dev:
    image: smart-energy/dashboard:dev
    container_name: smart-energy-dashboard-dev
    restart: unless-stopped
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      DB_HOST: smart-energy-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: ${DB_NAME:-smart_energy_db}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    depends_on:
      smart-energy-mysql:
        condition: service_healthy
    networks:
      - smart-energy-network

# ------------------------------------------------------------------------------
# Networks & Volumes
# ------------------------------------------------------------------------------
networks:
  smart-energy-network:
    name: smart-energy-network
    driver: bridge

volumes:
  smart-energy-mysql-data:
    name: smart-energy-mysql-data
